<h2 class="fs-1 fw-bolder text-center my-5">All Products</h2>

<div class="container py-5">
  <div class="row g-4">
    @for (product of ProductData; track product.id) {
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card product-card h-100 border-0 shadow-sm">
          <!-- Product Image -->
          <div class="product-image-wrapper">
            <img [src]="product.image" [alt]="product.title" class="product-image" />

            <!-- Category -->
            <span class="category-badge">
              {{ product.category }}
            </span>
          </div>

          <div class="card-body d-flex flex-column p-4">
            <!-- Product ID -->
            <small class="text-muted mb-2"> Product #{{ product.id }} </small>

            <!-- Title -->
            <h5 class="card-title product-title">
              {{ product.title }}
            </h5>

            <!-- Description -->
            <p class="card-text text-muted product-description">
              {{ product.description }}
            </p>

            <!-- Rating -->
            <div class="rating mb-3">
              <div class="d-flex align-items-center gap-2">
                <span class="stars">
                  @for (star of [1, 2, 3, 4, 5]; track star) {
                    <i
                      [class]="
                        star <= product.rating.rate ? 'fa-solid fa-star' : 'fa-regular fa-star'
                      "
                    ></i>
                  }
                </span>

                <span class="rating-value">
                  {{ product.rating.rate }}
                </span>

                <span class="text-muted small"> ({{ product.rating.count }}) </span>
              </div>
            </div>

            <!-- Price + Action -->
            <div class="mt-auto d-flex align-items-center justify-content-between">
              <div>
                <span class="price"> ${{ product.price }} </span>
              </div>

              <button class="btn btn-dark px-3">
                <i class="fa-solid fa-cart-shopping me-2"></i>
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
